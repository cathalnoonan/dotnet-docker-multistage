version: 2

updates:
  - package-ecosystem: "docker"
    commit-message:
      prefix: "[docker] "
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      dotnet-docker:
        patterns:
          - "dotnet/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "[github-actions] "
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    commit-message:
      prefix: "[nuget] "
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      core-dependencies:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      test-dependencies:
        patterns:
          - "coverlet.collector"
          - "Microsoft.NET.Test.*"
          - "Moq*"
          - "NUnit*"
          - "Testcontainers*"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
